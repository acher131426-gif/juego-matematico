<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ruta del Tesoro Matemático</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f8ff;
    }
    h1 { color: #2c3e50; }
    #game {
      display: none;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      gap: 10px;
      justify-content: center;
      margin: 20px;
    }
    .cell {
      width: 60px;
      height: 60px;
      background: #a3d5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-weight: bold;
    }
    .player {
      background: #ff7675 !important;
      color: white;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2ecc71;
      color: white;
    }
    #questionBox {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>🏴‍☠️ Ruta del Tesoro Matemático</h1>

<div id="start">
  <p>Resuelve sumas y restas para llegar al tesoro</p>
  <button onclick="startGame()">Jugar</button>
</div>

<div id="game">
  <div class="board" id="board"></div>
  <button onclick="rollDice()">Lanzar dado 🎲</button>
  <p id="status"></p>
</div>

<div id="questionBox">
  <h2 id="question"></h2>
  <input type="number" id="answer" />
  <br>
  <button onclick="checkAnswer()">Responder</button>
</div>

<script>
  let position = 0;
  let correctAnswer = 0;
  const boardSize = 20;

  function startGame() {
    document.getElementById('start').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    createBoard();
    updateBoard();
  }

  function createBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (let i = 0; i < boardSize; i++) {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.id = 'cell-' + i;
      cell.innerText = i + 1;
      board.appendChild(cell);
    }
  }

  function updateBoard() {
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('player'));
    document.getElementById('cell-' + position).classList.add('player');
  }

  function rollDice() {
    const dice = Math.floor(Math.random() * 6) + 1;
    position += dice;

    if (position >= boardSize - 1) {
      position = boardSize - 1;
      updateBoard();
      document.getElementById('status').innerText = "¡Ganaste el tesoro! 🏆";
      return;
    }

    updateBoard();
    generateQuestion();
  }

  function generateQuestion() {
    document.getElementById('questionBox').style.display = 'block';

    let a = Math.floor(Math.random() * 10) + 1;
    let b = Math.floor(Math.random() * 10) + 1;

    if (Math.random() > 0.5) {
      correctAnswer = a + b;
      document.getElementById('question').innerText = `${a} + ${b} = ?`;
    } else {
      correctAnswer = a - b;
      document.getElementById('question').innerText = `${a} - ${b} = ?`;
    }
  }

  function checkAnswer() {
    const userAnswer = parseInt(document.getElementById('answer').value);

    if (userAnswer === correctAnswer) {
      document.getElementById('status').innerText = "¡Correcto! Sigue avanzando 🚀";
    } else {
      document.getElementById('status').innerText = "Incorrecto 😢 retrocedes 1";
      position = Math.max(0, position - 1);
      updateBoard();
    }

    document.getElementById('questionBox').style.display = 'none';
    document.getElementById('answer').value = '';
  }
</script>

</body>
</html>
