<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrera Matemática</title>
<style>
body { font-family: Arial; text-align:center; background:#fff3cd; }
h1 { color:#333; }
.track { display:flex; justify-content:center; margin:20px; }
.cell { width:40px; height:40px; border:1px solid #999; margin:2px; }
.player { background:#28a745; }
.enemy { background:#dc3545; }
button { padding:10px; margin:10px; }
#questionBox { margin-top:20px; }
</style>
</head>
<body>

<h1>🏁 Carrera Matemática</h1>
<p>Responde bien para avanzar más rápido que el rival</p>

<div class="track" id="track"></div>

<button onclick="newQuestion()">Responder operación</button>

<div id="questionBox" style="display:none;">
<h2 id="question"></h2>
<input type="number" id="answer">
<br>
<button onclick="checkAnswer()">Responder</button>
</div>

<p id="status"></p>

<script>
let playerPos = 0;
let enemyPos = 0;
let correct = 0;
const size = 15;

function drawTrack() {
 const track = document.getElementById('track');
 track.innerHTML = '';
 for(let i=0;i<size;i++){
  const div=document.createElement('div');
  div.className='cell';
  if(i===playerPos) div.classList.add('player');
  if(i===enemyPos) div.classList.add('enemy');
  track.appendChild(div);
 }
}

function newQuestion(){
 document.getElementById('questionBox').style.display='block';
 let a=Math.floor(Math.random()*10);
 let b=Math.floor(Math.random()*10);
 if(Math.random()>0.5){
  correct=a+b;
  document.getElementById('question').innerText=`${a}+${b}`;
 }else{
  correct=a-b;
  document.getElementById('question').innerText=`${a}-${b}`;
 }
}

function checkAnswer(){
 let user=parseInt(document.getElementById('answer').value);
 document.getElementById('questionBox').style.display='none';
 document.getElementById('answer').value='';

 if(user===correct){
  playerPos+=2;
  document.getElementById('status').innerText='¡Correcto! Avanzas 2';
 }else{
  playerPos+=1;
  document.getElementById('status').innerText='Casi, avanzas 1';
 }

 enemyPos+=Math.floor(Math.random()*2)+1;

 if(playerPos>=size-1){
  alert('🏆 ¡Ganaste!');
  location.reload();
 }
 if(enemyPos>=size-1){
  alert('😢 Perdiste');
  location.reload();
 }

 drawTrack();
}

drawTrack();
</script>

</body>
</html>
